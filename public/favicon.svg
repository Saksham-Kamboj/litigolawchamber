<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0f0f0f"/>

  <!-- Top gold rule -->
  <line x1="10" y1="9" x2="54" y2="9" stroke="#c9a84c" stroke-width="1"/>

  <!-- Bottom gold rule -->
  <line x1="10" y1="55" x2="54" y2="55" stroke="#c9a84c" stroke-width="1"/>

  <!-- LLC monogram — Cormorant-style serif letterforms -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="Cormorant Garamond, Georgia, serif"
    font-size="26"
    font-weight="600"
    letter-spacing="3"
    fill="#c9a84c"
  >LLC</text>
</svg>
